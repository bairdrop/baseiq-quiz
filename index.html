    <!-- Base Mini App Specific -->
    <meta name="description" content="Test your knowledge about Base blockchain with BaseIQ Quiz. Three difficulty levels with 30 questions each!" />
    <meta name="keywords" content="Base, blockchain, quiz, Base chain, crypto, Coinbase, Layer 2, Ethereum" />
    
    <!-- SDK Ready Handler - MUST BE FIRST -->
    <script>
      (function() {
        let readyCalled = false;
        
        function callReady() {
          if (readyCalled) return;
          
          // Try all possible SDK formats
          if (window.sdk?.actions?.ready) {
            console.log('Calling sdk.actions.ready()');
            window.sdk.actions.ready();
            readyCalled = true;
          } else if (window.parent) {
            console.log('Posting message to parent');
            window.parent.postMessage({ type: 'ready' }, '*');
            window.parent.postMessage('ready', '*');
            readyCalled = true;
          }
        }
        
        // Wait for SDK to be injected
        let attempts = 0;
        const checkInterval = setInterval(function() {
          attempts++;
          if (window.sdk?.actions?.ready) {
            callReady();
            clearInterval(checkInterval);
          } else if (attempts > 50) {
            // After 5 seconds, just call it anyway
            callReady();
            clearInterval(checkInterval);
          }
        }, 100);
        
        // Also listen for SDK ready event
        window.addEventListener('message', function(event) {
          if (event.data === 'sdkReady' || event.data?.type === 'sdkReady') {
            callReady();
          }
        });
        
        // Call on load as backup
        window.addEventListener('load', function() {
          setTimeout(callReady, 1000);
        });
      })();
    </script>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;

        background: #000000;

      #root {
        min-height: 100vh;
        width: 100%;
      }
